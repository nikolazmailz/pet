services:
  srhr-ms-mock-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-eclipse-temurin:17-jre}
    container_name: srhr-ms-mock-service
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      WIREMOCK_PORT: 8080
      SERVER_PORT: 8081
      WIREMOCK_VERBOSE: "true"
    restart: unless-stopped
