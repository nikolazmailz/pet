server:
  port: 8080

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: ru.ntdev.srhr.pending.contracts
        spring.json.use.type.headers: true

pending-candidates:
  kafka:
    request-topic: srhr.requisition.to.easup
    response-topic: srhr.requisition.from.easup
    response-group: srhr-ms-requisition-rest-pending-candidates
  request-reply:
    timeout: 20s
    response-ttl: 1m
    response-key-prefix: "pending-candidates:response:"
    notification-channel: "pending-candidates:response-notifications"
