openapi: 3.0.1
info:
  title: HR сервис "Личный кабинет руководителя"
  description: Сервисы HR
  version: 6.5.0
servers:
  - url: /
    description: Default Server URL
tags:
  - name: Requisition
    description: The Requisition API
paths:
  /vacancy-info:
    post:
      tags:
        - requisition-post-vacancy-info
        - Requisition
      summary: Запрос на получение краткой информации о вакансии
      operationId: postRequisitionVacancyInfo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisitionVacancyInfoRequest'
        required: true
      responses:
        "401":
          description: Unauthorized
        "404":
          description: Информация не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "200":
          description: Информация получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequisitionVacancyInfoDtoOut'
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
  /vacancy-candidates:
    post:
      tags:
        - requisition-post-vacancy-candidates
        - Requisition
      summary: Возвращение данных кандидатов по вакансии
      operationId: postRequisitionVacancyCandidates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisitionPostVacancyCandidatesRequest'
        required: true
      responses:
        "200":
          description: Формирование списка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequisitionPostVacancyCandidatesDtoOut'
        "401":
          description: Unauthorized
        "404":
          description: Не получены данные для формирования списка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
  /pending-candidates:
    post:
      tags:
        - pending-candidates
        - Requisition
      summary: "Запрос данных по кандидатам, ожидающих решения для текущего пользо\
        вателя."
      operationId: collectPendingCandidates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PendingCandidatesApiRequest'
        required: true
      responses:
        "401":
          description: Unauthorized
        "200":
          description: Данные получены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingCandidatesApiResponse'
        "404":
          description: Данные не получены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
  /list:
    post:
      tags:
        - requisition-post-list
        - Requisition
      summary: Формирование списка
      operationId: postRequisitionList
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisitionPostListRequest'
        required: true
      responses:
        "401":
          description: Unauthorized
        "200":
          description: Формирование списка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequisitionPostListDtoOut'
        "404":
          description: Не получены данные для формирования списка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
  /interviewers-action:
    post:
      tags:
        - requisition-interviewers-action
        - Requisition
      summary: Отправка действий по интервьюерам
      operationId: getInterviewersActionResponse
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisitionInterviewerActionRequest'
        required: true
      responses:
        "404":
          description: Интервьюеры не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "401":
          description: Unauthorized
        "200":
          description: Интервьюеры получены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequisitionGetInterviewersOut'
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
  /candidate-recommendation:
    post:
      tags:
        - requisition-post-candidate-recommendation
        - Requisition
      summary: Запрос на отправку рекомендации по кандидату
      operationId: postRequisitionCandidateRecommendation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisitionCandidateRecommendationRequest'
        required: true
      responses:
        "404":
          description: Не отправлена рекомендация по кандидату
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "200":
          description: Рекомендация отправлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequisitionCandidateResumeDto'
        "401":
          description: Unauthorized
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
  /candidate-action:
    post:
      tags:
        - requisition-post-candidate-action
        - Requisition
      summary: Запрос на обновление данных кандидата на вакансию
      operationId: postRequisitionCandidateAction
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisitionCandidateActionRequest'
        required: true
      responses:
        "200":
          description: Формирование списка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequisitionGeneralCandidateDtoOut'
        "404":
          description: Не обновлены данные кандидата на вакансию
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "401":
          description: Unauthorized
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
  /add-comment:
    post:
      tags:
        - requisition-post-add-comment
        - Requisition
      summary: Запрос на добавление комментария кандидату
      operationId: postRequisitionAddComment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisitionAddCommentRequest'
        required: true
      responses:
        "200":
          description: Комментарий добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequisitionGeneralCandidateDtoOut'
        "401":
          description: Unauthorized
        "404":
          description: Не добавлен комментарий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
  /vacancy-statistics:
    get:
      tags:
        - requisition-vacancy-statistics
        - Requisition
      summary: Получение данных по воронке подбора
      operationId: getVacancyStatistic
      parameters:
        - name: vacancyId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Найдены данные по воронке подбора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequisitionVacancyStatisticDto'
        "404":
          description: Данные по воронке подбора не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "401":
          description: Unauthorized
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
  /vacancy-details:
    get:
      tags:
        - requisition-vacancy-details
        - Requisition
      summary: Получение детальных данных по вакансии
      operationId: getRequisitionVacancyDetails
      parameters:
        - name: vacancyId
          in: query
          required: true
          schema:
            maxLength: 19
            minLength: 0
            type: string
        - name: delegatorTn
          in: query
          required: false
          schema:
            maxLength: 8
            minLength: 0
            type: string
      responses:
        "200":
          description: Найдены детальные данные по вакансии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequisitionVacancyDetailsDtoOut'
        "401":
          description: Unauthorized
        "404":
          description: Детальные данные по вакансии не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
  /user-info:
    get:
      tags:
        - requisition-user-info
        - Requisition
      summary: Получение данных о текущем пользователе
      operationId: getRequisitionUserInfo
      responses:
        "200":
          description: Найдены данные о текущем пользователе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequisitionUserInfoDtoOut'
        "404":
          description: Данные о текущем пользователе не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "401":
          description: Unauthorized
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
  /ui-state:
    get:
      tags:
        - requisition-ui-state
        - Requisition
      summary: Получение статуса интерфейса
      operationId: getRequisitionUiState
      parameters:
        - name: delegatorTn
          in: query
          required: false
          schema:
            type: string
      responses:
        "401":
          description: Unauthorized
        "404":
          description: Статус интерфейса не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "200":
          description: Найден статус интерфейса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequisitionUiStateDtoOut'
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
  /staff-search:
    get:
      tags:
        - requisition-staff-search
        - Requisition
      summary: Получение сотрудников банка
      operationId: getRequisitionStaffSearch
      parameters:
        - name: searchStr
          in: query
          description: Строка поиска
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Найдены данные о сотрудниках банка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequisitionStaffSearchDtoOut'
        "404":
          description: Данные о сотрудниках банка не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "401":
          description: Unauthorized
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
  /org-units-allowable:
    get:
      tags:
        - requisition-org-units-allowable
        - Requisition
      summary: Получение доступных орг-единиц
      operationId: getRequisitionOrgUnitsAllowable
      responses:
        "200":
          description: Найдены доступные орг-единицы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequisitionOrgUnitsAllowableDtoOut'
        "401":
          description: Unauthorized
        "404":
          description: Доступные орг-единицы не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
  /get-interviewers:
    get:
      tags:
        - requisition-get-interviewers
        - Requisition
      summary: Получение интервьюеров
      operationId: getInterviewers
      parameters:
        - name: vacancyId
          in: query
          required: true
          schema:
            maxLength: 19
            minLength: 0
            type: string
      responses:
        "200":
          description: Интервьюеры получены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequisitionGetInterviewersOut'
        "401":
          description: Unauthorized
        "404":
          description: Интервьюеры получены не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
  /dict:
    get:
      tags:
        - requisition-dict
        - Requisition
      summary: Получение справочников
      operationId: getRequisitionDict
      responses:
        "404":
          description: Справочники не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "401":
          description: Unauthorized
        "200":
          description: Найдены справочники
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequisitionDictDtoOut'
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
  /delegations:
    get:
      tags:
        - requisition-delegations
        - Requisition
      summary: Получение статуса делегирования
      operationId: getRequisitionDelegations
      responses:
        "401":
          description: Unauthorized
        "404":
          description: Статус делегирования не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "200":
          description: Найден статус делегирования
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequisitionDelegationsDtoOut'
      security:
        - bearerAuth: [ ]
  /candidate-resume:
    get:
      tags:
        - requisition-candidate-resume
        - Requisition
      summary: Получение резюме по кандидату
      operationId: getCandidateResume
      parameters:
        - name: vacancyId
          in: query
          required: true
          schema:
            maxLength: 20
            minLength: 0
            type: string
        - name: candidateId
          in: query
          required: true
          schema:
            maxLength: 20
            minLength: 0
            type: string
      responses:
        "401":
          description: Unauthorized
        "404":
          description: Информация не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "200":
          description: Резюме по кандидату получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequisitionCandidateResumeDto'
      security:
        - bearerAuth: [ ]
  /candidate-info:
    get:
      tags:
        - requisition-candidate-info
        - Requisition
      summary: Получение информации по кандидату
      operationId: getCandidateInfo
      parameters:
        - name: vacancyId
          in: query
          required: true
          schema:
            maxLength: 20
            minLength: 0
            type: string
        - name: candidateId
          in: query
          required: true
          schema:
            maxLength: 20
            minLength: 0
            type: string
      responses:
        "200":
          description: Информация по кандидату получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequisitionGeneralCandidateDtoOut'
        "401":
          description: Unauthorized
        "404":
          description: Информация не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
components:
  schemas:
    RequisitionVacancyInfoReqItem:
      required:
        - guid
      type: object
      properties:
        guid:
          maxLength: 36
          type: string
          description: GUID заявки на подбор
      description: Объект с гуидом заявки на подбор
    RequisitionVacancyInfoRequest:
      type: object
      properties:
        requisitions:
          maxItems: 99999
          type: array
          description: Список информации по заявкам на подбор
          items:
            $ref: '#/components/schemas/RequisitionVacancyInfoReqItem'
      description: Тело запроса для получения информации по вакансии заявки на подбор
    SapErrorDetails:
      type: object
      properties:
        code:
          maxLength: 255
          type: string
          description: Код ошибки
          nullable: true
          example: '''510'''
        message:
          maxLength: 1000
          type: string
          description: Текст ошибки
          nullable: true
          example: Отсутствуют полномочия к данной группе
        '@SAP__common.Severity':
          maxLength: 255
          type: string
          description: Уровень критичности
          nullable: true
          example: Error
      description: Массив параметров деталей ошибки от сап
    ServiceError:
      type: object
      properties:
        message:
          maxLength: 4000
          type: string
          description: Текст ошибки
          nullable: true
          example: Ответ не найден
        code:
          maxLength: 200
          type: string
          description: Код ошибки
          nullable: true
        logId:
          maxLength: 200
          type: string
          description: Трейс ошибки
          nullable: true
        details:
          maxItems: 99999
          uniqueItems: true
          type: array
          description: Массив с детализированными данными по ошибке от сервисов
          nullable: true
          items:
            $ref: '#/components/schemas/SapErrorDetails'
      description: Массив параметров деталей ошибки от сервиса
      nullable: true
    ServiceErrorDto:
      type: object
      properties:
        ServiceError:
          $ref: '#/components/schemas/ServiceError'
      description: Сущность ошибки от сервисов
    RequisitionVacancyInfoData:
      required:
        - guid
        - statusLKRName
        - vacancyId
      type: object
      properties:
        guid:
          maxLength: 36
          type: string
          description: GUID заявки на подбор
        statusLKRName:
          maxLength: 35
          type: string
          description: Наименование статуса ЛКР из таблицы status_mapping
        vacancyId:
          maxLength: 20
          type: string
          description: Идентификатор вакансии
      description: Объект с информацией по вакансии и заявке на подбор
    RequisitionVacancyInfoDtoOut:
      type: object
      properties:
        requisitions:
          maxItems: 99999
          type: array
          description: Список информации по заявкам на подбор
          items:
            $ref: '#/components/schemas/RequisitionVacancyInfoRequisItem'
      description: Ответ на получение информации по заявке на подбор
    RequisitionVacancyInfoRequisItem:
      required:
        - vacancyInfo
      type: object
      properties:
        vacancyInfo:
          $ref: '#/components/schemas/RequisitionVacancyInfoData'
      description: Информация по заявке на подбор
    RequisitionFilterEventStatusCodeItem:
      type: object
      properties:
        statusCode:
          maxLength: 255
          type: string
          description: Код статуса
          nullable: true
        stageCode:
          maxLength: 255
          type: string
          description: Код этапа
          nullable: true
      description: Элемент списка фильтра по кодам статусов события
    RequisitionPostVacancyCandidatesRequest:
      required:
        - candidateTabsCode
        - page
        - pageSize
        - sortAttribute
        - sortDirection
        - vacancyId
      type: object
      properties:
        uuid:
          type: string
        responseCode:
          type: string
        errorMessage:
          type: string
        requestType:
          type: string
        adLogin:
          type: string
        sessionId:
          type: string
        channel:
          type: string
        traceId:
          type: string
        realm:
          type: string
        fileUuid:
          type: string
        vacancyId:
          maxLength: 20
          type: string
          description: Уникальный идентификатор вакансии
        candidateTabsCode:
          maxLength: 20
          type: string
          description: Код вкладки
        page:
          maximum: 1000000
          minimum: 1
          type: integer
          description: Номер страницы
          format: int32
        pageSize:
          maximum: 500
          minimum: 1
          type: integer
          description: 'Размер страницы '
          format: int32
        filter:
          $ref: '#/components/schemas/RequisitionVacancyCandidatesFiltersReq'
        skipCache:
          type: boolean
          description: Признак скип кэша при действиях с кандидатами
          nullable: true
        sortAttribute:
          maxLength: 11
          type: string
          description: Атрибут сортировки
        sortDirection:
          maxLength: 5
          type: string
          description: Направление сортировки
