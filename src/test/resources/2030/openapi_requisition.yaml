            $ref: '#/components/schemas/ExpirationZonesItem'
      description: Ответ на получение справочников
    RequisitionPagination:
      required:
        - defaultPageSize
      type: object
      properties:
        defaultPageSize:
          maximum: 500
          minimum: 1
          type: integer
          description: Размер страницы по умолчанию
          format: int32
        pageSizeOptionList:
          maximum: 9007199254740991
          minimum: 0
          maxItems: 10
          minItems: 1
          uniqueItems: true
          type: array
          description: Допустимые размеры страницы
          nullable: true
          items:
            type: integer
            format: int32
      description: Данные по пагинации
      nullable: true
    RequisitionStatusItem:
      required:
        - code
        - label
        - sortId
      type: object
      properties:
        code:
          maxLength: 50
          type: string
          description: Код статуса
          example: DRAFT
        label:
          maxLength: 200
          type: string
          description: Название статуса
          example: Черновик
        sortId:
          maximum: 1000
          minimum: 1
          type: integer
          description: Порядок отображения
          format: int32
        availableInTabList:
          maxItems: 10
          minItems: 1
          type: array
          description: "Вкладки, где статус доступен в фильтре"
          nullable: true
          items:
            type: string
        style:
          $ref: '#/components/schemas/RequisitionStatusesStyle'
      description: Данные по статусам
    RequisitionStatusesStyle:
      required:
        - backgroundColor
        - textColor
      type: object
      properties:
        textColor:
          maxLength: 12
          type: string
          description: Цвет текста
          example: '#1F2937'
        backgroundColor:
          maxLength: 12
          type: string
          description: Цвет фона
          example: '#1F2937'
      description: Данные по стилям
      nullable: true
    RequisitionTabItem:
      required:
        - code
        - label
      type: object
      properties:
        code:
          maxLength: 50
          type: string
          description: Код вкладки
          example: ACTIVE
        label:
          maxLength: 200
          type: string
          description: Название вкладки
          example: Активные заявки
      description: Данные по вкладкам
    RequisitionDelegationsDtoOut:
      type: object
      properties:
        delegationsList:
          maxItems: 99999
          minItems: 0
          type: array
          description: Массив данными по делегатам.
          nullable: true
          items:
            $ref: '#/components/schemas/RequisitionDelegationsItem'
      description: Ответ на получение делегирования
    RequisitionDelegationsItem:
      required:
        - authApprove
        - authCreate
        - id
        - name
      type: object
      properties:
        id:
          maxLength: 8
          type: string
          description: Идентификационный номер сервиса в ЕАСУП
          example: RECT
        name:
          maxLength: 250
          type: string
          description: Бизнес-описание идентификатора сервиса.
        startDate:
          maximum: 99999999999999
          minimum: -99999999999999
          type: integer
          description: Дата начала делегирования
          format: int64
          nullable: true
          example: 0
        endDate:
          maximum: 99999999999999
          minimum: -99999999999999
          type: integer
          description: Дата окончания делегирования
          format: int64
          nullable: true
          example: 0
        employee:
          $ref: '#/components/schemas/RequisitionEmployee'
        authApprove:
          type: boolean
          description: Полномочие на согласование заявок
        authCreate:
          type: boolean
          description: Полномочие на создание заявок
      description: Данные о делегировании
    RequisitionEmployee:
      required:
        - id
      type: object
      properties:
        id:
          maxLength: 8
          type: string
          description: Идентификатор
          example: '''112212'''
        fullName:
          maxLength: 132
          type: string
          description: Полное имя
          nullable: true
          example: Лимитова Декрета Петровна
        firstName:
          maxLength: 40
          type: string
          description: Имя
          nullable: true
          example: Декрета
        lastName:
          maxLength: 40
          type: string
          description: Фамилия
          nullable: true
          example: Лимитова
        middleName:
          maxLength: 40
          type: string
          description: Отчество
          nullable: true
          example: Петровна
      description: Данные о сотруднике
      nullable: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
