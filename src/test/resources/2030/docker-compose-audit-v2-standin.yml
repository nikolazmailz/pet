version: "3.9"
services:
  omni1-emulator-kafka-pump-standin:
    image: docker.repo-ci.sfera.inno.local/tsau-docker-pub/kafka-pump:6.2.0.10
    container_name: "omni1-emulator-kafka-pump-standin"
    depends_on:
      - omni1-emulator-kafka-2-standin
    environment:
      TSAU_KAFKA_PUMP_KAFKA_SOURCE_BOOTSTRAP_SERVERS: "omni1-emulator-kafka-2-standin:49092"
      TSAU_KAFKA_PUMP_KAFKA_TARGET_BOOTSTRAP_SERVERS: "omni1-emulator-kafka-2-standin:49092"

  omni1-emulator-opensearch-pump-standin:
    image: docker.repo-ci.sfera.inno.local/tsau-docker-pub/opensearch-pump-emulator:6.2.0.0
    container_name: "omni1-emulator-opensearch-pump-standin"
    depends_on:
      - omni1-emulator-kafka-2-standin
    environment:
      TSAU_OPENSEARCH_PUMP_KAFKA_BOOTSTRAP_SERVERS: "omni1-emulator-kafka-2-standin:49092"
  omni1-emulator-meta-pump-standin:
    image: docker.repo-ci.sfera.inno.local/tsau-docker-pub/meta-pump:6.2.0.2
    container_name: "omni1-emulator-meta-pump-standin"
    depends_on:
      - omni1-emulator-kafka-2-standin
    environment:
      META_PUMP_KAFKA_BOOTSTRAP_SERVERS: "omni1-emulator-kafka-2-standin:49092"

  omni1-emulator-zookeeper-2-standin:
    image: docker.repo-ci.sfera.inno.local/tsau-docker-pub/confluentinc/cp-zookeeper:6.2.2
    hostname: zookeeper
    container_name: omni1-emulator-zookeeper-2-standin
    ports:
      - "3381:3181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 3381
      ZOOKEEPER_TICK_TIME: 2000

  omni1-emulator-kafka-2-standin:
    image: docker.repo-ci.sfera.inno.local/tsau-docker-pub/confluentinc/cp-kafka:6.2.2
    hostname: broker
    container_name: omni1-emulator-kafka-2-standin
    depends_on:
      - omni1-emulator-zookeeper-2-standin
    ports:
      - "49092:49092"
      - "49091:49091"
    restart: always
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'omni1-emulator-zookeeper-2-standin:3381'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,LOCAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: LOCAL://localhost:49091,INTERNAL://omni1-emulator-kafka-2-standin:49092
      KAFKA_LISTENERS: LOCAL://:49091,INTERNAL://:49092
      KAFKA_INTER_BROKER_LISTENER_NAME: LOCAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0