spring:
  application:
    name: srhr-ms-task-blocker

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/srhr_task_blocker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: task-blocker-pool
      # Блокировщик — высоконагруженный, операции короткие и атомарные.
      # Пул держим компактным, но с быстрым таймаутом, чтобы не копить очередь.
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 3000      # мс, ждать соединение из пула не дольше 3с
      max-lifetime: 1800000         # 30 мин
      idle-timeout: 600000          # 10 мин

  jpa:
    hibernate:
      ddl-auto: validate            # схему создаёт Flyway, Hibernate только сверяет
    open-in-view: false             # обязательно off для нагруженного сервиса
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # лишних SQL-логов в проде быть не должно
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful              # дать долить активные запросы при остановке

# Actuator — health/readiness для оркестратора (k8s и т.п.)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    db:
      enabled: true

logging:
  level:
    root: INFO
    ru.srhr.taskblocker: INFO

---
# ===== Локальная разработка =====
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    ru.srhr.taskblocker: DEBUG
    org.hibernate.SQL: DEBUG       # видеть генерируемый upsert при отладке

---
# ===== Прод =====
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:50}
      minimum-idle: ${DB_POOL_MIN:10}
logging:
  level:
    root: WARN
    ru.srhr.taskblocker: INFO
