openapi: 3.0.1
info:
  title: HR сервис "Пересмотр заработной платы"
  description: Сервисы HR
  version: 9.0.0
servers:
  - url: /
    description: Default Server URL
tags:
  - name: Salarychange
    description: The Salarychange API
paths:
  /staff/detail:
    get:
      tags:
        - salarychange-staff-detail
        - Salarychange
      summary: Информация о сотруднике
      operationId: getSalarychangeStaffDetail
      parameters:
        - name: uuid
          in: query
          description: Идентификатор списка
          required: true
          schema:
            maxLength: 255
            minLength: 0
            type: string
        - name: lt
          in: query
          description: Тип списка
          required: true
          schema:
            maxLength: 16
            minLength: 0
            type: string
        - name: dc
          in: query
          description: Код зависимости
          required: true
          schema:
            maxLength: 16
            minLength: 0
            type: string
        - name: tn
          in: query
          description: Табельный номер персонала
          required: true
          schema:
            maxLength: 16
            minLength: 0
            type: string
        - name: posid
          in: query
          description: Идентификатор должности
          required: true
          schema:
            maxLength: 16
            minLength: 0
            type: string
        - name: exp
          in: query
          description: Параметр экспандов в еасуп
          required: true
          schema:
            maxLength: 1024
            minLength: 0
            type: string
        - name: emplFrom
          in: query
          required: false
          schema:
            maxLength: 8
            minLength: 0
            type: string
      responses:
        "200":
          description: Получена информация о сотруднике
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalarychangeStaffDetailDtoOut'
        "401":
          description: Unauthorized
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "404":
          description: Информация о сотруднике не получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
    post:
      tags:
        - Salarychange
        - salarychange-post-staff-detail
      summary: Корректировка данных по сотруднику
      operationId: postSalarychangeStaffDetail
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalarychangePostStaffDetailRequest'
        required: true
      responses:
        "401":
          description: Unauthorized
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "404":
          description: Не получены данные для корректировки данных по сотруднику
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "200":
          description: Корректировка данных по сотруднику
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalarychangePostStaffDetailDtoOut'
      security:
        - bearerAuth: [ ]
  /staff-multi-list:
    post:
      tags:
        - Salarychange
        - salarychange-post-staff-multi-list
      summary: Создание нескольких заявок на пересмотр ЗП
      operationId: postSalarychangeStaffMultiList
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalarychangePostStaffMultiListRequest'
        required: true
      responses:
        "404":
          description: Не получены данные для создание нескольких заявок на пересмотр
            ЗП
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "401":
          description: Unauthorized
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "200":
          description: Создание нескольких заявок на пересмотр ЗП произведено успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalarychangePostStaffMultiListRebaseDtoOut'
      security:
        - bearerAuth: [ ]
  /staff-multi-list/rebase:
    post:
      tags:
        - Salarychange
        - salarychange-post-staff-multi-list-rebase
      summary: Перенос сотрудников по списку
      operationId: postSalarychangeStaffMultiListRebase
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalarychangePostStaffMultiListRebaseRequest'
        required: true
      responses:
        "401":
          description: Unauthorized
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "200":
          description: Перенос списка сотрудников произведен успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalarychangePostStaffMultiListRebaseDtoOut'
        "404":
          description: Не получены данные для переноса списка сотрудников
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
  /staff-multi-list/action:
    post:
      tags:
        - Salarychange
        - salarychange-post-staff-multi-list-action
      summary: Редактирование списка сотрудников
      operationId: postSalarychangeStaffMultiListAction
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalarychangePostStaffMultiListActionRequest'
        required: true
      responses:
        "401":
          description: Unauthorized
        "404":
          description: Не получены данные для редактирования списка сотрудников
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "200":
          description: Редактирование списка сотрудников произведено успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalarychangePostStaffMultiListActionDtoOut'
      security:
        - bearerAuth: [ ]
  /staff-list:
    get:
      tags:
        - salarychange-staff-list
        - Salarychange
      summary: Получение реестра списков сотрудников
      operationId: getSalarychangeStaffList
      parameters:
        - name: exp
          in: query
          description: Параметр экспанд в еасуп
          required: true
          schema:
            maxLength: 1024
            minLength: 0
            type: string
        - name: lid
          in: query
          description: Идентификатор списка
          required: true
          schema:
            maxLength: 16
            minLength: 0
            type: string
      responses:
        "401":
          description: Unauthorized
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "200":
          description: Получен реестр списков сотрудников
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalarychangeStaffListDtoOut'
        "404":
          description: Реестр списков сотрудников не получен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
    post:
      tags:
        - Salarychange
        - salarychange-post-staff-list
      summary: Изменения предложений
      operationId: postSalarychangeStaffList
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalarychangePostStaffListRequest'
        required: true
      responses:
        "401":
          description: Unauthorized
        "404":
          description: Не получены изменения предложений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "200":
          description: Изменения предложений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalarychangePostStaffListDtoOut'
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
  /staff-list/event:
    post:
      tags:
        - Salarychange
        - salarychange-post-staff-list-event
      summary: Обработка действий со списком
      operationId: postSalarychangeStaffListEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalarychangePostStaffListEventRequest'
        required: true
      responses:
        "401":
          description: Unauthorized
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "404":
          description: Не получены данные для обработки действий со списком
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "200":
          description: Обработка действий со списком произведена успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalarychangePostStaffListEventDtoOut'
      security:
        - bearerAuth: [ ]
  /report/task:
    post:
      tags:
        - salarychange-post-report-task
        - Salarychange
      summary: Печать отчета
      operationId: postSalarychangeReportTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalarychangePostReportTaskRequest'
        required: true
      responses:
        "401":
          description: Unauthorized
        "404":
          description: Не получены данные для печати отчета
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "200":
          description: Печать отчета
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalarychangePostReportTaskDtoOut'
      security:
        - bearerAuth: [ ]
  /delegation:
    post:
      tags:
        - Salarychange
        - salarychange-post-delegation
      summary: Создание делегирования
      operationId: postSalarychangeDelegation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalarychangePostDelegationRequest'
        required: true
      responses:
        "401":
          description: Unauthorized
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "200":
          description: Создание делегирования
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalarychangePostDelegationDtoOut'
        "404":
          description: Не получены данные для создания делегирования
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
  /tab:
    get:
      tags:
        - Salarychange
        - salarychange-reference-tab
      summary: Получение списка настроек вкладок
      operationId: getSalarychangeReferenceTab
      parameters:
        - name: exp
          in: query
          description: Параметр экспандов в еасуп
          required: true
          schema:
            maxLength: 256
            minLength: 1
            type: string
      responses:
        "401":
          description: Unauthorized
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "404":
          description: Список настроек вкладок не получен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "200":
          description: Список настроек вкладок получен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalarychangeReferenceTabDtoOut'
      security:
        - bearerAuth: [ ]
  /staff/search:
    get:
      tags:
        - Salarychange
        - salarychange-staff-search
      summary: Запрос поиска сотрудников
      operationId: getSalarychangeStaffSearch
      parameters:
        - name: exp
          in: query
          description: Параметр экспандов в еасуп
          required: false
          schema:
            maxLength: 256
            minLength: 0
            type: string
          example: departmentsPath
        - name: f
          in: query
          description: Строка фильтрации
          required: false
          schema:
            maxLength: 255
            minLength: 0
            type: string
          example: searchOption eq 'SALREV'
        - name: top
          in: query
          description: "Количество записей, которые необходимо показать"
          required: false
          schema:
            maximum: 999999999
            minimum: 1
            type: integer
            format: int32
        - name: skip
          in: query
          description: "Количество записей, которые необходимо пропустить"
          required: false
          schema:
            maximum: 999999999
            minimum: 0
            type: integer
            format: int32
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "401":
          description: Unauthorized
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "200":
          description: Получены сотрудники по поиску
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalarychangeStaffSearchDtoOut'
        "404":
          description: Не получены сотрудники по поиску
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
  /staff/duty:
    get:
      tags:
        - Salarychange
        - salarychange-staff-duty
      summary: Получение ответственного сотрудника
      operationId: getSalarychangeStaffDuty
      parameters:
        - name: exp
          in: query
          description: Параметр экспандов в еасуп
          required: false
          schema:
            maxLength: 256
            minLength: 0
            type: string
        - name: search
          in: query
          description: Параметр поиска
          required: false
          schema:
            maxLength: 256
            minLength: 0
            type: string
        - name: top
          in: query
          description: Параметр исключения
          required: false
          schema:
            maximum: 999999999
            minimum: 0
            type: integer
            format: int32
        - name: skip
          in: query
          description: Параметр ограничения
          required: false
          schema:
            maximum: 999999999
            minimum: 0
            type: integer
            format: int32
        - name: filter
          in: query
          description: Параметр фильтрации
          required: false
          schema:
            maxLength: 256
            minLength: 0
            type: string
      responses:
        "401":
          description: Unauthorized
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "404":
          description: Не получен ответственный сотрудник
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "200":
          description: Получен ответственный сотрудник
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalarychangeStaffDutyDto'
      security:
        - bearerAuth: [ ]
  /staff/delegation-list:
    get:
      tags:
        - Salarychange
        - salarychange-staff-delegation-list
      summary: Получение списка делегирования
      operationId: getSalarychangeStaffDelegationList
      parameters:
        - name: f
          in: query
          description: Строка фильтрации
          required: false
          schema:
            maxLength: 255
            minLength: 0
            type: string
        - name: exp
          in: query
          description: Параметр экспандов в еасуп
          required: false
          schema:
            maxLength: 255
            minLength: 0
            type: string
        - name: order
          in: query
          description: Параметр упорядоченности
          required: false
          schema:
            maxLength: 16
            minLength: 0
            type: string
        - name: top
          in: query
          description: "Количество записей, которые необходимо показать"
          required: false
          schema:
            maximum: 999999999
            minimum: 1
            type: integer
            format: int32
        - name: skip
          in: query
          description: "Количество записей, которые необходимо пропустить"
          required: false
          schema:
            maximum: 999999999
            minimum: 0
            type: integer
            format: int32
        - name: str
          in: query
          description: Поисковая строка
          required: false
          schema:
            maxLength: 255
            minLength: 0
            type: string
      responses:
        "401":
          description: Unauthorized
        "200":
          description: Получен список делегирования
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalarychangeStaffDelegationListDtoOut'
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "404":
          description: Список делегирования не получен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
  /staff/chief:
    get:
      tags:
        - Salarychange
        - salarychange-staff-chief
      summary: Выбор руководителя для делегирования
      operationId: getSalarychangeStaffChief
      parameters:
        - name: exp
          in: query
          description: Параметр экспандов в еасуп
          required: false
          schema:
            maxLength: 256
            minLength: 0
            type: string
        - name: uuid
          in: query
          description: Guid
          required: false
          schema:
            maxLength: 256
            minLength: 0
            type: string
        - name: lt
          in: query
          description: Тип листа
          required: false
          schema:
            maxLength: 256
            minLength: 0
            type: string
      responses:
        "401":
          description: Unauthorized
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "404":
          description: Не получен руководитель для делегирования
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "200":
          description: Получен руководитель для делегирования
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalarychangeStaffChiefDto'
      security:
        - bearerAuth: [ ]
  /staff-list/detail:
    get:
      tags:
        - salarychange-staff-list-detail
        - Salarychange
      summary: Получение конкретного списка на пересмотр
      operationId: getSalarychangeStaffListDetail
      parameters:
        - name: uuid
          in: query
          description: Идентификатор
          required: true
          schema:
            maxLength: 255
            minLength: 0
            type: string
        - name: t
          in: query
          description: Тип
          required: true
          schema:
            maxLength: 255
            minLength: 0
            type: string
        - name: depCode
          in: query
          description: Код
          required: true
          schema:
            maxLength: 255
            minLength: 0
            type: string
        - name: exp
          in: query
          description: Экспанд
          required: false
          schema:
            maxLength: 1024
            minLength: 0
            type: string
      responses:
        "401":
          description: Unauthorized
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "200":
          description: Получен конкретный список на пересмотр
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalarychangeStaffListDetailDtoOut'
        "404":
          description: Конкретный список на пересмотр не получен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
  /staff-dependency:
    get:
      tags:
        - Salarychange
        - salarychange-staff-dependency
      summary: Получение информации о структуре подчинения сотрудников
      operationId: getSalarychangeStaffDependency
      responses:
        "200":
          description: Получена информация о структуре подчинения сотрудников
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalarychangeStaffDependencyDtoOut'
        "401":
          description: Unauthorized
        "404":
          description: Информация о структуре подчинения сотрудников не получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
      security:
        - bearerAuth: [ ]
  /staff-dependency-exp:
    get:
      tags:
        - salarychange-staff-dependency-exp
        - Salarychange
      summary: Формирование списков с расширением выдачи информации
      operationId: getSalarychangeStaffDependencyExp
      responses:
        "401":
          description: Unauthorized
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "404":
          description: Информация о формировании списков с расширением выдачи информации
            не получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
        "200":
          description: Получена информация о формировании списков с расширением выдачи
            информации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalarychangeStaffDependencyExpDtoOut'
      security:
        - bearerAuth: [ ]
  /report/task/status:
    get:
      tags:
        - salarychange-report-task-status
        - Salarychange
      summary: Определение статуса задачи печати
      operationId: getSalarychangeReportTaskStatus
      parameters:
        - name: tid
          in: query
          required: true
          schema:
            maxLength: 255
            minLength: 0
            type: string
      responses:
        "401":
          description: Unauthorized
        "500":
          description: Непредвиденная ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceErrorDto'
