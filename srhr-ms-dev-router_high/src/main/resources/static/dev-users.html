<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SRHR DEV user</title>
    <style>
        :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
        body { max-width: 760px; margin: 48px auto; padding: 0 20px; }
        .current, button { border-radius: 10px; }
        .current { padding: 16px; margin: 20px 0; background: color-mix(in srgb, CanvasText 8%, Canvas); }
        .users { display: grid; gap: 10px; }
        button { padding: 12px 16px; text-align: left; cursor: pointer; border: 1px solid #8886; background: Canvas; }
        button:hover { border-color: #5b7cfa; }
        .secondary { margin-top: 20px; color: #b33; }
        code { font-size: .9em; }
    </style>
</head>
<body>
<h1>SRHR DEV user</h1>
<p>Выберите профиль, заголовки которого DEV-router будет передавать в SRHR-сервисы.</p>
<div class="current" id="current">Загрузка...</div>
<div class="users" id="users"></div>
<button class="secondary" id="clear">Сбросить выбор</button>

<script>
    const api = '/dev/session';

    async function refresh() {
        const [users, current] = await Promise.all([
            fetch(`${api}/users`).then(r => r.json()),
            fetch(`${api}/current`).then(r => r.json())
        ]);
        document.querySelector('#current').innerHTML =
            `Текущий пользователь: <strong>${escapeHtml(current.displayName)}</strong><br>` +
            `<code>${escapeHtml(current.id)} · ${escapeHtml(current.selectedBy)}</code>`;

        const container = document.querySelector('#users');
        container.replaceChildren(...users.map(user => {
            const button = document.createElement('button');
            button.textContent = `${user.displayName} (${user.id})`;
            button.onclick = async () => {
                await fetch(`${api}/user/${encodeURIComponent(user.id)}`, { method: 'POST' });
                await refresh();
            };
            return button;
        }));
    }

    document.querySelector('#clear').onclick = async () => {
        await fetch(api, { method: 'DELETE' });
        await refresh();
    };

    function escapeHtml(value) {
        const element = document.createElement('div');
        element.textContent = value;
        return element.innerHTML;
    }

    refresh().catch(error => {
        document.querySelector('#current').textContent = `Ошибка: ${error}`;
    });
</script>
</body>
</html>
