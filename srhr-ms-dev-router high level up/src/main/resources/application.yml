server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: srhr-ms-dev-router
  cloud:
    gateway:
      httpclient:
        connect-timeout: ${ROUTER_CONNECT_TIMEOUT_MS:3000}
        response-timeout: ${ROUTER_RESPONSE_TIMEOUT:30s}
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - ${FRONTEND_ORIGIN:https://information-about-salary.srhr.innodev.local}
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers: '*'
            exposed-headers:
              - X-Request-ID
            allow-credentials: true
            max-age: 3600
      routes:
        - id: paystub
          uri: ${PAYSTUB_ROUTE_URI:http://srhr-ms-paystub-rest:8180}
          predicates:
            - Path=/ui-api-web/cross/srhr/paystub/**
          filters:
            - StripPrefix=4

        - id: userinfo
          uri: ${USERINFO_ROUTE_URI:http://srhr-ms-userinfo-rest:8180}
          predicates:
            - Path=/ui-api-web/cross/srhr/userinfo/**
          filters:
            - StripPrefix=4

        - id: userphoto
          uri: ${USERPHOTO_ROUTE_URI:http://srhr-ms-userphoto-rest:8180}
          predicates:
            - Path=/ui-api-web/cross/srhr/userphoto/**
          filters:
            - StripPrefix=4

dev-router:
  jwt:
    issuer: ${DEV_JWT_ISSUER:srhr-ms-dev-router}
    audience: ${DEV_JWT_AUDIENCE:srhr-dev}
    key-id: ${DEV_JWT_KEY_ID:srhr-dev-router-key}
    ttl: ${DEV_JWT_TTL:PT1H}
    default-user: ${DEV_JWT_DEFAULT_USER:developer}
    users:
      developer:
        sub: ${DEV_JWT_DEVELOPER_SUB:developer@VTB.RU}
        session-id: ${DEV_JWT_DEVELOPER_SESSION_ID:dev-session-developer}
        channel: ${DEV_JWT_DEVELOPER_CHANNEL:WEB}
        realm: ${DEV_JWT_DEVELOPER_REALM:SRHR}
      reviewer:
        sub: ${DEV_JWT_REVIEWER_SUB:reviewer@VTB.RU}
        session-id: ${DEV_JWT_REVIEWER_SESSION_ID:dev-session-reviewer}
        channel: ${DEV_JWT_REVIEWER_CHANNEL:WEB}
        realm: ${DEV_JWT_REVIEWER_REALM:SRHR}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.gateway: INFO
    ru.ntdev.srhr.devrouter: INFO
